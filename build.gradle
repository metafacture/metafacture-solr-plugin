group 'org.metafacture'
version '0.3.0'

apply plugin: 'java'

sourceCompatibility = 11
targetCompatibility = 11
compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.metafacture:metafacture-framework:8.0.0'
    implementation 'org.codehaus.jcsp:jcsp:1.1-rc5'
    implementation 'org.apache.solr:solr-solrj:7.4.0'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
    testImplementation 'org.metafacture:metafacture-xml:8.0.0'
    testImplementation 'org.metafacture:metafacture-io:8.0.0'
    testImplementation 'org.metafacture:metafacture-strings:8.0.0'
    testImplementation 'org.mockito:mockito-core:2.5.5'
}

task fatJar(type: Jar) {
    from {
        configurations.compile.collect { it.isDirectory() ? it : zipTree(it) }
    }
    archiveName = archivesBaseName.replace('-plugin', '') + '-' + version + '-plugin' + '.jar'
    with jar
}
